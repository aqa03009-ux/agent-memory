<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="agent-memory — local-first memory for AI agents">
  <title>agent-memory — local-first memory for AI agents</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0a111c"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#34e0d0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0d1626" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25436e"/>
      <stop offset="1" stop-color="#10203a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34e0d0" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#5b8cff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8fb4ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- ambient glows -->
  <ellipse cx="1040" cy="205" rx="190" ry="150" fill="url(#glow)"/>
  <ellipse cx="250" cy="200" rx="220" ry="150" fill="url(#glow)" opacity="0.55"/>

  <!-- note cards -->
  <g transform="translate(0,-14)">
    <g transform="rotate(-7 190 205)">
      <rect x="96" y="118" width="164" height="196" rx="14" fill="url(#card)" stroke="#2b3f5e"/>
      <rect x="114" y="140" width="74" height="8" rx="4" fill="#6ea8ff" opacity="0.85"/>
      <rect x="114" y="160" width="126" height="5" rx="2.5" fill="#8aa3c0" opacity="0.45"/>
      <rect x="114" y="175" width="112" height="5" rx="2.5" fill="#8aa3c0" opacity="0.35"/>
      <rect x="114" y="190" width="120" height="5" rx="2.5" fill="#8aa3c0" opacity="0.35"/>
      <rect x="114" y="216" width="54" height="16" rx="8" fill="#34e0d0" opacity="0.16"/>
      <text x="121" y="228" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#34e0d0" letter-spacing="0.6">tags:</text>
    </g>
    <g transform="rotate(4 250 205)">
      <rect x="170" y="108" width="164" height="196" rx="14" fill="#101b2e" stroke="#38507a"/>
      <text x="188" y="136" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c9d8ef" letter-spacing="0.2"># TTS setup</text>
      <rect x="188" y="152" width="118" height="5" rx="2.5" fill="#8aa3c0" opacity="0.45"/>
      <rect x="188" y="168" width="102" height="5" rx="2.5" fill="#8aa3c0" opacity="0.35"/>
      <rect x="188" y="184" width="126" height="5" rx="2.5" fill="#8aa3c0" opacity="0.30"/>
      <rect x="188" y="200" width="88" height="5" rx="2.5" fill="#8aa3c0" opacity="0.30"/>
      <rect x="188" y="226" width="84" height="18" rx="9" fill="#5b8cff" opacity="0.14" stroke="#5b8cff" stroke-opacity="0.35"/>
      <text x="196" y="239" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#9fc0ff" letter-spacing="0.4">[[wikilink]]</text>
    </g>
  </g>

  <!-- flow: notes -> index -->
  <path d="M338 214 C 470 150, 600 272, 740 208 S 900 168, 972 196"
        fill="none" stroke="url(#flow)" stroke-width="2.6" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M338 214 C 470 150, 600 272, 740 208 S 900 168, 972 196"
        fill="none" stroke="#8fc3ff" stroke-width="0.8" stroke-opacity="0.5" stroke-dasharray="2 7"/>

  <!-- particles -->
  <g fill="#7fb4ff">
    <circle cx="402" cy="187" r="2.6" opacity="0.85"/>
    <circle cx="468" cy="178" r="1.8" opacity="0.55"/>
    <circle cx="560" cy="228" r="3.1" opacity="0.9"/>
    <circle cx="632" cy="243" r="1.7" opacity="0.5"/>
    <circle cx="700" cy="221" r="2.4" opacity="0.75"/>
  </g>
  <g fill="#34e0d0">
    <circle cx="772" cy="196" r="2.1" opacity="0.8"/>
    <circle cx="852" cy="180" r="2.8" opacity="0.9"/>
    <circle cx="922" cy="184" r="1.8" opacity="0.6"/>
    <circle cx="958" cy="192" r="3.2" opacity="0.95"/>
  </g>

  <!-- database cylinder -->
  <g>
    <ellipse cx="1040" cy="286" rx="76" ry="20" fill="#34e0d0" opacity="0.10" filter="url(#blur)"/>
    <path d="M976 142 L976 268 A64 18 0 0 0 1104 268 L1104 142 Z"
          fill="url(#db)" stroke="#3d6ba8" stroke-width="1.3"/>
    <ellipse cx="1040" cy="142" rx="64" ry="18" fill="#1a3054" stroke="#5b8cff" stroke-opacity="0.8" stroke-width="1.3"/>
    <ellipse cx="1040" cy="142" rx="44" ry="11" fill="none" stroke="#6ea8ff" stroke-opacity="0.35"/>
    <path d="M976 188 A64 18 0 0 0 1104 188" fill="none" stroke="#33547f" stroke-width="1.1"/>
    <path d="M976 224 A64 18 0 0 0 1104 224" fill="none" stroke="#33547f" stroke-width="1.1"/>
    <path d="M976 258 A64 18 0 0 0 1104 258" fill="none" stroke="#33547f" stroke-width="1.1"/>
    <text x="1040" y="165" text-anchor="middle"
          font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="9" fill="#9fc0ff" letter-spacing="1.6">FTS5</text>
    <text x="1040" y="204" text-anchor="middle"
          font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="9" fill="#9fc0ff" letter-spacing="1.6">VECTORS</text>
    <text x="1040" y="242" text-anchor="middle"
          font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="9" fill="#34e0d0" letter-spacing="1.6">RRF</text>
  </g>

  <!-- wordmark -->
  <text x="88" y="342"
        font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="600" fill="#eef4ff" letter-spacing="-1.6">agent-memory</text>
  <text x="92" y="372"
        font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12.5" fill="#8aa3c0" letter-spacing="4.4">LOCAL-FIRST MEMORY FOR AI AGENTS</text>

  <text x="1192" y="372" text-anchor="end"
        font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="10.5" fill="#56708e" letter-spacing="2.1">MARKDOWN · SQLITE · MCP</text>
</svg>
